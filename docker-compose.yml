services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: se-iot-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: se-iot-backend
    ports:
      - "5001:5000"
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: "5000"
      FLASK_DEBUG: "false"
      CORS_ORIGIN: "http://localhost:5174"
      MQTT_HOST: "1.tcp.ap.ngrok.io"
      MQTT_PORT: "24488"
      MQTT_TOPIC: "Test sensor/+"
      MQTT_USERNAME: "chirpstack"
      MQTT_PASSWORD: "trident4664"
      SENSOR_HISTORY_LIMIT: "100"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:5001"
    container_name: se-iot-frontend
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: unless-stopped
