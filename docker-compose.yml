services:
  broker:
    image: eclipse-mosquitto:2
    container_name: se-iot-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/password.txt:/mosquitto/config/password.txt:ro
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: se-iot-backend
    ports:
      - "5001:5000"
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: "5000"
      FLASK_DEBUG: "false"
      CORS_ORIGIN: "http://tempse.local:5174"
      MQTT_HOST: "broker"
      MQTT_PORT: "1883"
      MQTT_TOPIC: "Test sensor/+"
      MQTT_USERNAME: "${MQTT_USERNAME}"
      MQTT_PASSWORD: "${MQTT_PASSWORD}"
      DATABASE_PATH: "/data/sensor_data.db"
      STORAGE_WARNING_PERCENT: "85"
      STORAGE_CLEANUP_TARGET_PERCENT: "80"
      STORAGE_CLEANUP_BATCH_SIZE: "10000"
      STORAGE_MIN_READINGS: "100"
      SENSOR_RETENTION_DAYS: "31"
    volumes:
      - sensor_data:/data
    depends_on:
      - broker
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    container_name: se-iot-frontend
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sensor_data:
